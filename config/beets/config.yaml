# Everything except the per-host paths, which the belak.beets home-manager
# module generates into a config.yaml that includes this file.
#
# The master tree holds the best copy of each album, normally FLAC. Every
# tagging decision happens there; the derived MP3 tree is regenerated from it.

plugins:
  # Library shape.
  - inline
  - zero

  # Editing. Tags are hand-owned, so these are the primary interface.
  - edit
  - fromfilename
  - ftintitle
  - rewrite

  # Derived MP3 tree.
  - alternatives
  - convert

  # Art and sidecar files.
  - fetchart
  - embedart
  - filetote

  # Audio analysis.
  - replaygain

  # Metadata source.
  - musicbrainz
  # Loaded but idle - see the chroma block below.
  - chroma

  # Library maintenance and querying.
  - mbsync
  - duplicates
  - missing
  - badfiles
  - fuzzy
  - info

import:
  # timid means every change needs explicit approval, so nothing is applied
  # unreviewed.
  autotag: yes
  timid: yes

  copy: yes
  move: no
  write: yes
  incremental: yes

# Track numbers restart per disc, so the disc prefix below is what distinguishes
# 2.01 from 1.01.
per_disc_numbering: yes

# Prefer the pressing actually owned. media and countries are ordered lists
# scored by position, so earlier entries win.
#
# original_year is off deliberately: it biases toward the earliest release, but a
# 2013 remaster should match the 2013 release, not the 1959 original.
match:
  preferred:
    media: ['CD', 'Digital Media|File', 'Vinyl']
    countries: ['US', 'GB|UK', 'Europe']
    original_year: no

# Featured artists belong in the title, not the artist field, so the device's
# artist browser groups by performer rather than by guest combination.
ftintitle:
  auto: yes
  format: '(feat. {0})'

# Collapse a bandleader's ensembles into one artist folder. Paths only - the tags
# keep the full credited name.
#
# Patterns match the lowercased value anchored at the start, so they need a
# trailing `.*` and an optional `(the )?`.
rewrite:
  artist (the )?jacob zimmerman.*: Jacob Zimmerman
  artist (the )?glenn crytzer.*: Glenn Crytzer
  artist (the )?jonathan doyle.*: Jonathan Doyle
  artist (the )?greg ruby.*: Greg Ruby

  # Jonathan Doyle under other banners, with no shared name to key on.
  artist the spirit of kansas city meets chicago: Jonathan Doyle
  artist the oxblood melodians: Jonathan Doyle

  # Keeps the ensemble name, drops only the standing "featuring" credit.
  artist jonathan stout and his campus five featuring hilary alexander: Jonathan Stout and his Campus Five

# Off because fingerprinting decodes every file and makes an Acoustid call per
# track before matching starts. With auto off chroma contributes nothing, so
# enable it per-run for a rip whose tags are too poor to search by name:
#
#   beet -c <(echo 'chroma: {auto: yes}') import <path>
chroma:
  auto: no

# Single-disc albums get an empty prefix, multi-disc albums get "2." and so on.
# There is no built-in field for this and $disctotal is truthy at 1.
#
# NOTE: not nested under `inline:` - that plugin reads the global config, so this
# has to sit at the top level or it is silently ignored.
item_fields:
  disc_prefix: |
    return '%d.' % disc if disctotal and disctotal > 1 else ''

# <album artist>/<album> (<year>)/[<disc>.]<track>. <title>[ (<track artist>)]
#
# The track-artist suffix is keyed two ways: `comp:` is beets' own compilation
# flag, and the albumartist key catches albums imported as-is where nothing sets
# it.
#
# aunique keys on mb_albumartistid, not albumartist: rewrite turns albumartist
# into a computed field, so aunique's self-match query compares that rewritten
# value against the raw column and never matches - even against itself - for
# any album whose rewrite rule changes the string. mb_albumartistid isn't
# touched by rewrite, so it matches.
paths:
  default: $albumartist/$album ($year)%aunique{mb_albumartistid album}/$disc_prefix$track. $title
  'albumartist:Various Artists': $albumartist/$album ($year)%aunique{mb_albumartistid album}/$disc_prefix$track. $title ($artist)
  comp: $albumartist/$album ($year)%aunique{mb_albumartistid album}/$disc_prefix$track. $title ($artist)
  singleton: $artist/Non-Album/$title

# Paths must survive FAT32/exFAT. These merge with the stock rules and win where
# they overlap, because entries here are applied first.
replace:
  # Curly quotes only reach paths, not tags. Doubles fall through to the
  # straight-quote rule below and become underscores.
  '[\u2018\u2019]': "'"
  '[\u201c\u201d]': _

  # Double colons ($the fed hop :: extras$) need their own rule - the single-
  # colon rule below fires on each colon independently, so "::" ends up as
  # " -  - " instead of one separator. This must come first.
  '\s*::\s*': ' - '

  # Collapse the surrounding spaces too, so "Op. 67: I. Allegro" becomes
  # "Op. 67 - I. Allegro" rather than picking up a double space.
  '\s*:\s*': ' - '
  '[<>\?\*\|]': _
  '\"': _
  '[\\/]': _
  '^\.': _
  '\.$': _
  '[\x00-\x1f]': _
  '\s+$': ''

# Target hardware caps the full path near 260 characters; budget under 240.
max_filename_length: 200

# Whitelist, not blacklist - a blacklist never converges, because each ripper and
# store invents new junk fields.
#
# `images` and `comp` look like noise but are not: dropping `images` strips the
# art embedart just added, and dropping `comp` stops the `comp:` path rule above
# from ever matching. Names not on mediafile's field list are ignored silently,
# so a typo just stops keeping the field.
#
# NOTE: zero hooks the `write` event, so anything imported as-is with -A needs an
# explicit `beet write -f <query>` afterwards.
zero:
  keep_fields: >
    title artist album albumartist albumartist_sort composer composer_sort
    genre track tracktotal disc disctotal year date original_date original_year
    comp lyrics rg_track_gain rg_track_peak rg_album_gain rg_album_peak
    mb_trackid mb_albumid mb_artistid mb_albumartistid mb_releasegroupid
    images
  update_database: yes

# Defaults omit albumartist and composer, the two fields this library turns on.
edit:
  itemfields: track title artist albumartist composer
  albumfields: album albumartist albumartist_sort genre

# Both embedded art and a cover.jpg sidecar, because they fail differently: the
# sidecar survives format conversion, the embedded copy survives a single file
# being copied out of its directory.
fetchart:
  auto: yes
  art_filename: cover
  maxwidth: 1200

  # Baseline rather than progressive JPEG, which the target hardware cannot
  # decode. Deliberately NOT cover_format: JPEG - that converts art in place in
  # the source directory and re-encodes lossless art into a lossy master.
  deinterlace: yes

  # Capitalised duplicates are load-bearing: fetchart ranks candidates
  # case-sensitively but decides eligibility case-insensitively, so
  # "Digital Back Cover.png" outranks "cover.png" unless "Cover" is listed too.
  cover_names: [cover, Cover, front, Front, art, Art, album, Album, folder, Folder]

  sources:
    - filesystem
    - coverart
    - itunes
    - albumart

embedart:
  auto: yes
  maxwidth: 500
  ifempty: no
  # Baseline JPEG only; the target hardware cannot decode progressive.
  quality: 90

# Master-tree sidecars, never carried into the derived tree - alternatives copies
# audio and album art and nothing else.
#
# .m3u is excluded because EAC writes relative filenames that break on rename.
# Images come along except the cover itself, which fetchart already writes at the
# configured size. A pattern rather than exclude.filenames, which is exact and
# case-sensitive.
filetote:
  extensions: .cue .log .txt .pdf .jpg .jpeg .png
  exclude:
    patterns:
      art_written_by_fetchart:
        - '[Cc]over.jpg'
        - '[Cc]over.jpeg'
        - '[Cc]over.png'
  pairing:
    enabled: yes
    extensions: .lrc
  print_ignored: yes

# metaflac writes native FLAC ReplayGain tags and is faster than ffmpeg. FLAC-only
# is fine: analysis runs on import, and the derived MP3s inherit the tags.
replaygain:
  auto: yes
  backend: metaflac
  # Misleading name: this is force-on-import. On, because incoming ReplayGain tags
  # are of unknown provenance and reference level.
  overwrite: yes

# The derived tree, on the NAS. Same relative paths as the master so the two can
# be diffed. Run `beet alt update derived` after importing.
alternatives:
  derived:
    formats: mp3
    removable: no
    # Audio plus a cover.jpg sidecar, nothing else. Art conversion belongs here
    # rather than in fetchart: this is the only tree that cannot cope with PNG or
    # progressive JPEG.
    album_art_copy: yes
    album_art_embed: yes
    album_art_maxwidth: 500
    album_art_format: JPEG
    album_art_deinterlace: yes

convert:
  # Only the derived tree is ever converted, so no format token in any path.
  format: mp3
  album_art_maxwidth: 500
  embed: yes
  formats:
    mp3:
      command: ffmpeg -i $source -y -vn -acodec libmp3lame -q:a 0 $dest
      extension: mp3

ui:
  color: yes
